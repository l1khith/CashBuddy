<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">CashBuddy app icon</title><desc id="desc">A glossy blue-violet wallet with teal and pink cards and a white Indian rupee symbol on a dark background.</desc>
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#176BFF"/><stop offset=".48" stop-color="#2A28E9"/><stop offset="1" stop-color="#4B14CE"/></linearGradient>
  <linearGradient id="tileEdge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4DAAFF"/><stop offset=".5" stop-color="#5146FF"/><stop offset="1" stop-color="#171F9A"/></linearGradient>
  <linearGradient id="cardTeal" x1="0" y1="0" x2=".95" y2="1"><stop offset="0" stop-color="#5CFFE8"/><stop offset=".43" stop-color="#13D9C2"/><stop offset="1" stop-color="#068EAD"/></linearGradient>
  <linearGradient id="cardPink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF84D8"/><stop offset=".52" stop-color="#F22FBC"/><stop offset="1" stop-color="#A91DD9"/></linearGradient>
  <linearGradient id="walletFace" x1="0" y1="0" x2="1" y2=".92"><stop offset="0" stop-color="#42D6FF"/><stop offset=".24" stop-color="#2877FF"/><stop offset=".62" stop-color="#243AF3"/><stop offset="1" stop-color="#3921C9"/></linearGradient>
  <linearGradient id="walletSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#605CFF"/><stop offset=".55" stop-color="#3537EF"/><stop offset="1" stop-color="#20159C"/></linearGradient>
  <linearGradient id="clasp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7778FF"/><stop offset=".55" stop-color="#4F43F5"/><stop offset="1" stop-color="#2720C9"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#81FFF1"/><stop offset=".5" stop-color="#72D9FF"/><stop offset="1" stop-color="#AA9BFF"/></linearGradient>
  <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C7C8FF"/></linearGradient>
  <linearGradient id="rimLite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".72"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<!-- full bleed background; system launchers can mask the icon naturally -->
<rect width="1024" height="1024" fill="#050713"/>
<!-- primary tile -->
<rect x="168" y="168" width="688" height="688" rx="156" fill="url(#tile)"/>
<rect x="169.5" y="169.5" width="685" height="685" rx="154" fill="none" stroke="url(#tileEdge)" stroke-width="3" opacity=".82"/>
<path d="M238 346 C276 236 376 190 497 190 H684 C746 190 804 222 826 277" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="3" stroke-linecap="round"/>
<!-- teal card, set behind the pink card -->
<path d="M352 390 L627 300 C656 291 676 305 683 331 L704 399 L357 496 L335 441 C328 420 335 402 352 390 Z" fill="#061A74" opacity=".22"/>
<path d="M356 386 L627 300 C654 292 677 306 683 332 L702 392 L365 490 L343 435 C337 415 340 398 356 386 Z" fill="url(#cardTeal)"/>
<path d="M371 395 L625 316 C649 309 665 319 671 341" fill="none" stroke="#DFFFFA" stroke-width="5" stroke-linecap="round" opacity=".6"/>
<!-- pink card -->
<path d="M360 430 L674 347 C704 339 725 354 731 380 L746 428 L369 528 L345 471 C338 452 342 438 360 430 Z" fill="#6512B1" opacity=".25"/>
<path d="M359 427 L675 347 C704 339 724 353 731 379 L746 425 L368 523 L345 470 C337 450 341 435 359 427 Z" fill="url(#cardPink)"/>
<path d="M381 434 L674 359 C699 353 713 364 719 385" fill="none" stroke="#FFE6F8" stroke-width="5" stroke-linecap="round" opacity=".64"/>
<!-- back edge and lower-right body give depth without a baked shadow -->
<path d="M292 398 L724 475 C748 479 765 500 765 525 L765 654 C765 685 741 707 709 705 L355 667 C316 663 290 638 290 601 L290 432 C290 414 291 404 292 398 Z" fill="url(#walletSide)"/>
<!-- wallet face -->
<path d="M282 403 C282 377 303 364 328 369 L704 437 C730 442 748 462 748 490 L748 638 C748 675 723 704 688 701 L333 662 C297 658 278 632 278 599 L278 428 C278 416 279 408 282 403 Z" fill="url(#walletFace)"/>
<!-- top rim: a single clean highlight helps the wallet opening read at small sizes -->
<path d="M292 402 C292 385 308 377 329 381 L701 448 C720 451 733 465 733 483" fill="none" stroke="url(#rim)" stroke-width="11" stroke-linecap="round"/>
<path d="M292 410 C296 397 308 394 324 397 L698 463" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".38"/>
<!-- small color reflection on left face; shape is deliberately broad, not a glowing effect -->
<path d="M279 444 C286 421 302 418 318 421 L333 424 L333 632 C304 627 279 604 279 577 Z" fill="#8DF4FF" opacity=".12"/>
<!-- main rupee symbol -->
<text x="456" y="667" font-family="Roboto, 'Noto Sans Devanagari', Arial, sans-serif" font-size="218" font-weight="700" fill="#FDFDFF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="1.3">₹</text>
<!-- clasp strap -->
<path d="M644 548 C647 525 666 510 692 505 L778 494 C800 491 814 506 814 528 L814 614 C814 637 800 652 779 656 L689 669 C662 673 642 657 639 634 Z" fill="url(#clasp)"/>
<path d="M650 548 C655 530 671 520 694 516 L777 506" fill="none" stroke="#D6D4FF" stroke-width="5" stroke-linecap="round" opacity=".7"/>
<circle cx="714" cy="584" r="29" fill="url(#pearl)"/>
<circle cx="707" cy="576" r="7" fill="#FFFFFF" opacity=".58"/>
</svg>